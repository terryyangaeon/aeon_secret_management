# Local DEV: app + its own Postgres.  Usage:  docker compose up -d --build
# Then open http://localhost:8094 and sign in with the bootstrap admin (see README).
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpw
      POSTGRES_DB: appreg_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5435:5432"          # psql / DB Browser from the host: localhost:5435
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appreg_dev"]
      interval: 5s
      retries: 10

  app:
    build: .
    image: aeon-secret-management:dev
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:devpw@db:5432/appreg_dev
      APP_SECRET: ${APP_SECRET:-dev-only-secret-change-me}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # The rotation scheduler is OFF in DEV: a DEV copy pointing at the real
      # tenant would otherwise rotate production secrets.
      ROTATE_ENABLED: ${ROTATE_ENABLED:-0}
      ROTATE_INTERVAL_MIN: ${ROTATE_INTERVAL_MIN:-60}
      COOLIFY_URL: ${COOLIFY_URL:-}
      COOLIFY_API_TOKEN: ${COOLIFY_API_TOKEN:-}
      # Microsoft sign-in + Graph — put these in a git-ignored .env next to this file
      SSO_TENANT_ID: ${SSO_TENANT_ID:-}
      SSO_CLIENT_ID: ${SSO_CLIENT_ID:-}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:-}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-1}
    ports:
      - "8094:8080"          # taken already: 8090 OneView DEV, 8091 PWH Attendance DEV,
                             # 8092 Access Control Attendance DEV, 8093 iotwa-dash

volumes:
  pgdata:
